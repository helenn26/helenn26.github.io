
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW 6 - JavaScript Statements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 8px;
        }

        .navbar {
            background-color: #2c3e50;
            overflow: hidden;
            margin: 20px 0;
            border-radius: 6px;
        }

        .navbar a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 14px 16px;
        }

        .navbar a:hover {
            background-color: #04AA6D;
            color: white;
        }

        main {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        p {
            background-color: #eaf2f8;
            color: #2c3e50;
            padding: 12px;
            margin: 10px 0;
            border-left: 4px solid #04AA6D;
            border-radius: 4px;
        }

        .google-button {
            display: inline-block;
            background-color: rgba(4, 170, 109, 0.8);
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            margin-top: 15px;
            border-radius: 6px;
        }

        .google-button:hover {
            opacity: 0.6;
        }

        @media (min-width: 480px) {
            body {
                padding: 30px;
            }

            header {
                padding: 35px;
            }

            main {
                max-width: 900px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>JavaScript Statements</h1>
        <p>Learning how JavaScript variables and statements work.</p>
    </header>

    <nav class="navbar">
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact Us</a>
    </nav>

    <main>
        <section id="about">
            <h2>JavaScript Calculations</h2>

            <p id="demo1"></p>
            <p id="demo2"></p>
            <p id="demo3"></p>
            <p id="demo4"></p>
            <p id="demo5"></p>
        </section>

        <section id="services">

        </section>

        <section id="contact">
            <h2>Visit Google</h2>
            <a class="google-button" href="https://www.google.com" target="_blank">
                Go to Google
            </a>
        </section>
    </main>

    <script>
        let a = 10;
        let b = 5;
        let c = a - b;
        let d = 15;
        let e = c + d;

        document.getElementById("demo1").textContent = "a = " + a;
        document.getElementById("demo2").textContent = "b = " + b;
        document.getElementById("demo3").textContent = "c = " + c;
        document.getElementById("demo4").textContent = "d = " + d;
        document.getElementById("demo5").textContent = "e = " + e;
    </script>

</body>
</html>
