<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #222;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #2f3e50;
            float: left;
            color: white;
        }

        .logo {
            text-align: center;
            padding: 25px 10px;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid #39495c;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            margin: 5px 15px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background-color: #5299d3;
        }

        .sidebar a.active {
            background-color: #5299d3;
        }

        .content {
            margin-left: 250px;
            padding: 30px 40px;
            min-height: calc(100vh - 60px);
            background-color: #f1f5f9;
        }

        .content h1 {
            color: #111;
            margin-top: 25px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            MyApp
        </div>

        <a href="#dashboard" class="active">🏠 Dashboard</a>
        <a href="#analytics">📊 Analytics</a>
        <a href="#projects">📁 Projects</a>
        <a href="#team">👥 Team</a>
        <a href="#messages">📧 Messages</a>
        <a href="#settings">⚙️ Settings</a>
        <a href="#documents">📄 Documents</a>
        <a href="#logout">🚪 Logout</a>

    </div>

    <div class="content" id="dashboard">

        <h1>Welcome to the Dashboard</h1>

        <p>
            Click on the links in the vertical navigation bar on the left.
        </p>

    </div>

</body>
